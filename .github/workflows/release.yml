name: Release

# Publishes to crates.io by Trusted Publishing (GitHub OIDC): no stored token.
# Requires the crates.io Trusted Publisher (workflow `release.yml`, environment
# `crates-io`) and a `crates-io` environment limited to `v*` tags.
# Never add a `pull_request_target` or `workflow_run` trigger.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch: # a dry run: every check, no publish, no GitHub release

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The whole CI workflow against the tagged commit, PostgreSQL included.
  ci:
    name: CI
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify:
    name: ✅ verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: just
      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --locked --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi
      - name: golden vectors
        run: just golden

  # The only job that can mint a token.
  publish:
    name: 🚀 publish to crates.io
    needs: [ci, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - run: cargo publish --dry-run --locked --all-features
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked --all-features
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Re-runnable; tolerates an existing release. The only job with `contents: write`.
  github-release:
    name: 🏷️ GitHub release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
                 --title "doubleentry $GITHUB_REF_NAME"
