name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

env:
  ZOLA_VERSION: "0.23.6"
  # SHA-256 of zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz, verified before the
  # tarball is extracted. Update both values together.
  ZOLA_SHA256: "8f5132b3522412d04e395e0b25f6d68613ad272a873e54a2b3ebf664873024a4"

jobs:
  # `zola check` fails on broken links.
  build:
    name: 🏗 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install zola
        run: |
          tarball="zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSLf -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/${tarball}"
          echo "${ZOLA_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          sudo tar xzf "$RUNNER_TEMP/$tarball" -C /usr/local/bin zola

      - name: build
        working-directory: site
        run: zola build

      - name: check
        working-directory: site
        run: zola check

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    name: 🚀 deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
