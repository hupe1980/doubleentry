name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every check but skip the crates.io publish"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: stable

jobs:
  verify:
    name: ✅ verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Resolve crate version
        id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Crate version: $version"

      - name: Tag must match Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          version="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match Cargo.toml version $version"
            exit 1
          fi

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # The full suite, Docker-backed PostgreSQL included: a release must not
      # ship a backend that the conformance suite has not just passed.
      - run: cargo test --all-features
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features
      - run: cargo publish --dry-run --all-features

  golden:
    name: 🔒 golden vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Hashes are only stable if the bytes behind them are. A release that
      # silently changes the canonical encoding invalidates every seal ever
      # issued by an earlier version, so the vectors gate the tag rather than
      # merely riding along with the test suite.
      - run: cargo test --all-features --test golden

  publish:
    name: 🚀 publish to crates.io
    needs: [verify, golden]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    environment: crates-io
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --all-features

  github-release:
    name: 🏷️ GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "v${{ needs.verify.outputs.version }}" \
            --generate-notes \
            --verify-tag
