name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

env:
  ZOLA_VERSION: "0.23.2"

jobs:
  # Builds on every push and pull request. `internal_level = "error"` in
  # config.toml makes a broken internal link fail here rather than ship a 404,
  # which is the failure mode a docs site actually has.
  build:
    name: 🏗 build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: install zola
        run: |
          curl -sSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin zola

      - name: build
        working-directory: site
        run: zola build

      - name: check
        working-directory: site
        run: zola check

      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: site/public

  deploy:
    name: 🚀 deploy
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
